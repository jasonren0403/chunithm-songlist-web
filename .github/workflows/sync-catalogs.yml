name: Sync catalogs

on:
  schedule:
    # 每日 02:30 UTC（UTC+8 10:30，国服更新 10:00 生效后）
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      regions:
        description: '同步区服：all，或以空格/逗号分隔的 jpn、exp、chn 列表'
        type: string
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-catalogs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGIONS_INPUT: ${{ inputs.regions }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 同步脚本零依赖，测试也只用 node:test，无需安装依赖
      - name: Run sync script tests
        run: node --test scripts/*.test.mjs

      - name: Sync catalogs
        run: |
          set -euo pipefail
          regions="${REGIONS_INPUT:-all}"
          args=""
          if [ "$regions" != "all" ]; then
            args="$(echo "$regions" | tr ',' ' ')"
          fi
          echo "ARGS=$args" >> "$GITHUB_ENV"
          # 脚本自身会校验区服名，非法值直接报错退出
          # shellcheck disable=SC2086
          node scripts/sync-catalogs.mjs $args 2>&1 | tee sync.log

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain public/)" ]; then
            echo "Catalogs unchanged, nothing to commit."
            exit 0
          fi
          base="${GITHUB_REF#refs/heads/}"
          branch="catalog-sync"
          summary="$(grep -E '首曲目|行曲目数据' sync.log || true)"
          body="$(printf '%s\n\n%s\n' "$summary" '自动曲库同步产物，重跑工作流会更新本 PR；请审核后手动合并。')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add public/data public/images
          git commit \
            -m "chore(data): sync catalogs (${ARGS:-all})" \
            -m "$summary"
          # 机器人专用分支：远端若是上次未合并的旧同步，直接以本次为准
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore(data): sync catalogs (${ARGS:-all})" \
              --body "$body"
          else
            echo "Open PR for $branch already exists; the push updated it."
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Catalog sync'
            echo
            if [ -f sync.log ]; then
              echo '```'
              grep -E '本次同步区服|首曲目|行曲目数据|已同步' sync.log || tail -n 20 sync.log
              echo '```'
            else
              echo '_Sync did not run._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
