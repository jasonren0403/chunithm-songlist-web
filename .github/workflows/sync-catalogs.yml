name: Sync catalogs

on:
  schedule:
    # 每周四 02:30 UTC（UTC+8 10:30，国服更新 10:00 生效后）
    - cron: '30 2 * * 4'
  workflow_dispatch:
    inputs:
      regions:
        description: '同步区服：all，或以空格/逗号分隔的 jpn、exp、chn 列表'
        type: string
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-catalogs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGIONS_INPUT: ${{ inputs.regions }}
      COVERS_REPO: jasonren0403/chunithm-songlist-covers
    steps:
      - name: Check covers token
        env:
          COVERS_TOKEN: ${{ secrets.COVERS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COVERS_TOKEN:-}" ]; then
            echo "::error::需要配置 COVERS_TOKEN secret（对封面仓有读写权限的 PAT）"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # 封面仓为私有仓，submodule 拉取需要具备两个仓访问权限的 PAT
          token: ${{ secrets.COVERS_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 同步脚本零依赖，测试也只用 node:test，无需安装依赖
      - name: Run sync script tests
        run: node --test scripts/*.test.mjs

      - name: Sync catalogs
        run: |
          set -euo pipefail
          regions="${REGIONS_INPUT:-all}"
          args=""
          if [ "$regions" != "all" ]; then
            args="$(echo "$regions" | tr ',' ' ')"
          fi
          echo "ARGS=$args" >> "$GITHUB_ENV"
          # 脚本自身会校验区服名，非法值直接报错退出
          # shellcheck disable=SC2086
          node scripts/sync-catalogs.mjs $args 2>&1 | tee sync.log

      # 封面在独立的 covers 仓（submodule），改动先提交到该仓，再回写主仓指针
      - name: Commit cover updates to the covers repo
        env:
          COVERS_TOKEN: ${{ secrets.COVERS_TOKEN }}
        run: |
          set -euo pipefail
          covers_dir="public/images"
          if [ -z "${COVERS_TOKEN:-}" ]; then
            echo "::error::需要配置 COVERS_TOKEN secret 才能向封面仓推送"
            exit 1
          fi
          # 主仓记录的 submodule 指针可能落后于封面仓 main，先对齐再提交
          git -C "$covers_dir" fetch origin main
          if [ -n "$(git -C "$covers_dir" status --porcelain)" ]; then
            git -C "$covers_dir" config user.name 'github-actions[bot]'
            git -C "$covers_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$covers_dir" add -A
            git -C "$covers_dir" commit -m "chore: update cover art (${ARGS:-all})"
            git -C "$covers_dir" rebase origin/main
          else
            # 无本地改动时也把 submodule 对齐到封面仓 main，避免主仓指针长期落后
            git -C "$covers_dir" reset --hard origin/main
          fi
          if git -C "$covers_dir" diff --quiet origin/main HEAD; then
            echo "Covers already up to date."
          else
            git -C "$covers_dir" push \
              "https://x-access-token:${COVERS_TOKEN}@github.com/${COVERS_REPO}.git" HEAD:main
          fi

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain public/)" ]; then
            echo "Catalogs unchanged, nothing to commit."
            exit 0
          fi
          base="${GITHUB_REF#refs/heads/}"
          branch="catalog-sync"
          regions="${ARGS:-all}"
          regions_label="$(echo "$regions" | tr ' ' ',')"
          sync_date="$(TZ=Asia/Shanghai date +%F)"
          title="chore(data): sync catalogs ${sync_date} (${regions_label})"
          summary="$(grep -E '首曲目|行曲目数据' sync.log || true)"
          body="$(printf '%s\n\n%s\n' "$summary" '自动曲库同步产物，重跑工作流会更新本 PR 的标题与内容；请审核后手动合并。')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add public/data public/images
          git commit \
            -m "chore(data): sync catalogs ${sync_date} (${regions_label})" \
            -m "$summary"
          # 机器人专用分支：远端若是上次未合并的旧同步，直接以本次为准
          git push --force origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
            echo "PR #${pr_number} updated: ${title}"
          else
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Catalog sync'
            echo
            if [ -f sync.log ]; then
              echo '```'
              grep -E '本次同步区服|首曲目|行曲目数据|已同步' sync.log || tail -n 20 sync.log
              echo '```'
            else
              echo '_Sync did not run._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
